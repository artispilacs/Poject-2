<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Workshop Notebook</title>
</head>
<body>
  <h1>HTML Workshop Notebook</h1>
  <h2>GET Method Example</h2>

  <p>
    Sample GET link:
    <a href="https://www.google.com/search?q=HTML5+forms">
      Search for HTML5 forms
    </a>
  </p>

  <form
    id="search-form"
    action="https://www.google.com/search"
    method="get"
    target="_blank"
    autocomplete="on"
    accept-charset="UTF-8"
  >
    <fieldset>
      <legend>Search the web</legend>

      <label for="query">Search term:</label>
      <input
        type="search"
        id="query"
        name="q"
        placeholder="HTML5 forms"
        required
      >
      <button type="submit">Search using GET</button>
    </fieldset>
  </form>
</body>
</html>
